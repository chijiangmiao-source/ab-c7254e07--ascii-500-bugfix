services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: axle-upload-api:latest
    environment:
      DATA_DIR: /data
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - upload-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status==204 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped

  # One-shot acceptance service: runs an end-to-end scenario against the API
  # (including an API restart between partial and resumed uploads) and exits.
  # Usage: docker compose run --rm verify
  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    image: axle-upload-verify:latest
    environment:
      API_BASE_URL: http://api:8000
      DATA_DIR: /data
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - upload-data:/data
    restart: "no"

volumes:
  upload-data:
